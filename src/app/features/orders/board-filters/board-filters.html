<div class="filters">
  <mat-form-field appearance="outline" class="search-field" subscriptSizing="dynamic">
    <mat-label>Search by order number or table</mat-label>
    <span matPrefix class="search-icon" aria-hidden="true">🔍</span>
    <input matInput inputmode="numeric" [formControl]="search" />
  </mat-form-field>

  <div class="pills" role="group" aria-label="Filter by order type">
    @for (opt of typeOptions; track opt.label) {
      <button
        type="button"
        class="pill"
        [class.active]="filters().type === opt.value"
        [attr.aria-pressed]="filters().type === opt.value"
        (click)="onTypeChange(opt.value)"
      >
        {{ opt.label }}
      </button>
    }
  </div>
</div>
