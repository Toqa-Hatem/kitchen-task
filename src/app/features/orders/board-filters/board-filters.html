<div class="d-flex flex-column flex-md-row gap-3 align-items-md-center">
  <mat-form-field appearance="outline" class="search-field" subscriptSizing="dynamic">
    <mat-label>Search by order number or table</mat-label>
    <input matInput inputmode="numeric" [formControl]="search" />
  </mat-form-field>

  <mat-button-toggle-group
    aria-label="Filter by order type"
    [value]="filters().type"
    (change)="onTypeChange($event.value)"
  >
    @for (opt of typeOptions; track opt.label) {
      <mat-button-toggle [value]="opt.value">{{ opt.label }}</mat-button-toggle>
    }
  </mat-button-toggle-group>
</div>
